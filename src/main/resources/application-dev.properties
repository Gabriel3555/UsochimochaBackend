spring.datasource.url=jdbc:postgresql://localhost:5432/usochicamocha_local
spring.datasource.username=postgres
spring.datasource.password=nala

# Zona horaria: Colombia (UTC-5)
spring.jackson.time-zone=America/Bogota
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

jwt.issuer.generator=UsochimochaBackend
jwt.secret.password=932aea0e6a85a4e55ac59d87f70aa47ec05b25709ad2ec95854771209849eb00
# Mientras exista la BD actual: Hibernate sigue gestionando el esquema.
# Al recrear la BD desde cero: cambiar a "none" y dejar que Flyway cree todo.
spring.jpa.hibernate.ddl-auto=update

# Flyway — migrations en classpath:db/migration
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate: en la BD existente, marca V1 como ya aplicado sin ejecutarlo.
# En una BD nueva vacía, Flyway ejecuta V1 normalmente.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Repara automáticamente migraciones fallidas antes de reintentar
spring.flyway.repair-on-migrate=true