spring.application.name=UsochicamochaBackend
spring.profiles.active=dev

# Detrás de nginx (que termina TLS y reenvía por HTTP interno), sin esto Spring cree que
# toda petición llegó por HTTP y arma URLs absolutas (ServletUriComponentsBuilder) con
# http:// en vez de https://, lo que el navegador bloquea como Mixed Content en producción.
server.forward-headers-strategy=framework

# Zona horaria: Colombia (UTC-5)
spring.jackson.time-zone=America/Bogota
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Raíz de almacenamiento (ruta absoluta o relativa al directorio de trabajo del proceso)
app.storage.uploads-root=uploads

# Combustibles: tolerancia de discrepancia entre total calculado y total ingresado por el operario (1%)
app.fuel.discrepancia-tolerancia-porcentaje=0.01

# Combustibles: Rendimiento — cuántas desviaciones estándar del propio historial del
# activo se toleran antes de marcar alerta (solo aplica con >=2 tanqueos previos
# comparables; con menos, se usa la tolerancia fija del 15% hardcodeada en
# FuelPerformanceService).
app.fuel.rendimiento-desviacion-multiplicador-aprendido=1.5
