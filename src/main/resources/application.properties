spring.application.name=UsochicamochaBackend
spring.profiles.active=dev

# Detrás de nginx (que termina TLS y reenvía por HTTP interno), sin esto Spring cree que
# toda petición llegó por HTTP y arma URLs absolutas (ServletUriComponentsBuilder) con
# http:// en vez de https://, lo que el navegador bloquea como Mixed Content en producción.
server.forward-headers-strategy=framework

# Zona horaria: Colombia (UTC-5)
spring.jackson.time-zone=America/Bogota
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Raíz de almacenamiento (ruta absoluta o relativa al directorio de trabajo del proceso)
app.storage.uploads-root=uploads

# Límites máximos de carga de combustible por tipo de activo (en litros)
fuel.max-quantity.machine=500
fuel.max-quantity.vehicle=120
fuel.max-quantity.moto=25

# Combustibles: tolerancia de discrepancia entre total calculado y total ingresado por el operario (1%)
app.fuel.discrepancia-tolerancia-porcentaje=0.01

# Combustibles: Rendimiento — tolerancia fija de desviación (galones reales vs.
# proyectados) usada mientras el activo no tiene las 2 desviaciones previas mínimas
# para "aprender" su propio rango (ver rendimiento-desviacion-multiplicador-aprendido
# más abajo, que toma el relevo una vez hay historial suficiente).
app.fuel.rendimiento-desviacion-tolerancia-porcentaje=0.08

# Combustibles: Rendimiento — cuántas desviaciones estándar del propio historial del
# activo se toleran antes de marcar alerta (solo aplica con >=2 tanqueos previos
# comparables; con menos, se usa la tolerancia fija de arriba).
app.fuel.rendimiento-desviacion-multiplicador-aprendido=1.5

# Combustibles: Rendimiento — techo absoluto de desviación en modo "aprendido": por más
# consistente (o variable) que sea el historial propio de un activo, una desviación
# nunca deja de alertar si supera este porcentaje. Evita que un activo con mucha
# variabilidad histórica termine con una banda aprendida demasiado laxa.
app.fuel.rendimiento-desviacion-tolerancia-maxima-porcentaje=0.13
